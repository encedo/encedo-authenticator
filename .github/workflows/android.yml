# Android build for Google Play, run on every push to main and by hand.
#
# What comes out: a release AAB (for Play) and a release APK (to sideload),
# both for arm64 + armv7, with a SHA256SUMS file, as one workflow artifact.
#
# Two ways to sign the Play build, chosen by which secrets exist:
#   - no UPLOAD_KEYSTORE_B64 secret: the outputs are UNSIGNED. Download them,
#     check the sums, sign offline with the upload key (jarsigner for the AAB,
#     apksigner for the APK) and upload to Play. Play App Signing then re-signs
#     with the app signing key it holds.
#   - UPLOAD_KEYSTORE_B64 + UPLOAD_KEYSTORE_PASSWORD + UPLOAD_KEY_ALIAS +
#     UPLOAD_KEY_PASSWORD set: Gradle signs here with the upload key, exactly as
#     scripts/vostro-release-aab.sh does.
#
# Pre-release for testers (manual run with `prerelease` ticked): the same code
# as the .dev build from scripts/vostro-dev-apk.sh — package
# com.encedo.mobile.auth.android.dev, so it installs next to v1 and never
# collides with the Play version — signed with the TEST key (secrets
# TEST_KEYSTORE_B64 + TEST_KEYSTORE_PASSWORD, alias encedo-test; nothing to do
# with the upload key) and published as a GitHub pre-release anyone can
# download. An unsigned APK cannot be installed, hence the test key.
#
# Push needs GOOGLE_SERVICES_JSON (the raw google-services.json for the Firebase
# project); without it the app still builds, but cannot register for push.
#
# versionCode comes from tauri.conf.json (2.0.0 -> 2000000) unless the manual
# run sets one; Play refuses an upload that does not raise it. Pre-releases use
# 2100000 + run number, above the vostro dev counter.

name: Android

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      prerelease:
        description: "Tester build: .dev package, test key, published as a GitHub pre-release"
        required: false
        type: boolean
        default: false
      version_code:
        description: "Android versionCode (empty = derived from tauri.conf.json; ignored for a pre-release)"
        required: false
        type: string

concurrency:
  group: android-${{ github.ref }}-${{ inputs.prerelease == true && 'prerelease' || 'release' }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  NDK_VERSION: 27.0.12077973
  BUILD_TOOLS: 35.0.0

jobs:
  test:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Frontend checks
        run: |
          npm ci
          npm run check
          npm test
          npm run build

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            src-tauri/crates/protocol

      - name: Tauri desktop dependencies (the core is tested as a Linux library)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev pkg-config

      - name: Protocol crate, with the module side for the round trips
        run: cargo test --manifest-path src-tauri/crates/protocol/Cargo.toml --features hem

      - name: App core
        run: cargo test --manifest-path src-tauri/Cargo.toml

  android:
    name: ${{ inputs.prerelease == true && 'Tester APK (pre-release)' || 'AAB + APK' }}
    runs-on: ubuntu-24.04
    needs: test
    timeout-minutes: 90
    permissions:
      contents: write   # the pre-release and its tag
    env:
      # Secrets cannot be read in `if:`; they can in env, so the choices are made here.
      PRERELEASE: ${{ inputs.prerelease == true }}
      HAS_KEYSTORE: ${{ secrets.UPLOAD_KEYSTORE_B64 != '' && inputs.prerelease != true }}
      HAS_TEST_KEY: ${{ secrets.TEST_KEYSTORE_B64 != '' }}
      HAS_FIREBASE: ${{ secrets.GOOGLE_SERVICES_JSON != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: A pre-release needs the test key
        if: env.PRERELEASE == 'true' && env.HAS_TEST_KEY != 'true'
        run: |
          echo "::error::Set the TEST_KEYSTORE_B64 and TEST_KEYSTORE_PASSWORD secrets: an unsigned APK cannot be installed."
          exit 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-36 build-tools;35.0.0 ndk;27.0.12077973
          accept-android-sdk-licenses: true

      - name: Point Tauri at the NDK
        run: echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: android

      # gen/android/buildSrc hard-codes `cargo tauri android android-studio-script`
      # (the project was initialised with cargo tauri), so the npm CLI alone is not enough.
      - uses: cargo-bins/cargo-binstall@main
      - name: Tauri CLI for cargo, same version as @tauri-apps/cli in package-lock.json
        run: |
          cargo binstall -y tauri-cli@2.11.4
          cargo tauri --version

      - name: Firebase resources
        if: env.HAS_FIREBASE == 'true'
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          printf '%s' "$GOOGLE_SERVICES_JSON" > "$RUNNER_TEMP/google-services.json"
          python3 scripts/firebase-res.py "$RUNNER_TEMP/google-services.json"

      - name: No Firebase config
        if: env.HAS_FIREBASE != 'true'
        run: echo "::warning::GOOGLE_SERVICES_JSON is not set. The app builds, but will not get a push token."

      - name: Upload key for Gradle signing
        if: env.HAS_KEYSTORE == 'true'
        env:
          UPLOAD_KEYSTORE_B64: ${{ secrets.UPLOAD_KEYSTORE_B64 }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          printf '%s' "$UPLOAD_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          umask 077
          cat > src-tauri/gen/android/keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/upload.jks
          storePassword=$UPLOAD_KEYSTORE_PASSWORD
          keyAlias=$UPLOAD_KEY_ALIAS
          keyPassword=$UPLOAD_KEY_PASSWORD
          EOF

      - name: versionCode override
        if: env.PRERELEASE != 'true' && inputs.version_code != ''
        env:
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          python3 - <<'EOF'
          import json, os, pathlib
          p = pathlib.Path("src-tauri/tauri.android.conf.json")
          d = json.loads(p.read_text())
          d.setdefault("bundle", {}).setdefault("android", {})["versionCode"] = int(os.environ["VERSION_CODE"])
          p.write_text(json.dumps(d, indent=2) + "\n")
          print(p.read_text())
          EOF

      # Mirrors scripts/vostro-dev-apk.sh: the identifier stays the production one
      # (Tauri finds the Kotlin sources by it), the .dev applicationId and name
      # come from Gradle and strings.xml.
      - name: Dev flavour for testers
        if: env.PRERELEASE == 'true'
        run: |
          python3 - <<'EOF'
          import json, os, pathlib
          base = json.loads(pathlib.Path("src-tauri/tauri.conf.json").read_text())["version"]
          n = int(os.environ["GITHUB_RUN_NUMBER"])
          p = pathlib.Path("src-tauri/tauri.android.conf.json")
          d = json.loads(p.read_text())
          d["productName"] = "Encedo HEM Auth dev"
          d["version"] = f"{base}-dev.{n}"
          d.setdefault("bundle", {}).setdefault("android", {})["versionCode"] = 2100000 + n
          p.write_text(json.dumps(d, indent=2) + "\n")
          print(p.read_text())
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"DEV_VERSION={base}-dev.{n}\nDEV_TAG=v{base}-dev.{n}\n")
          EOF
          sed -i 's/applicationId = "com.encedo.mobile.auth.android.v2"/applicationId = "com.encedo.mobile.auth.android.dev"/' src-tauri/gen/android/app/build.gradle.kts
          sed -i 's/<string name="app_name">[^<]*<\/string>/<string name="app_name">Encedo HEM Auth dev<\/string>/; s/<string name="main_activity_title">[^<]*<\/string>/<string name="main_activity_title">Encedo HEM Auth dev<\/string>/' src-tauri/gen/android/app/src/main/res/values/strings.xml
          grep -n applicationId src-tauri/gen/android/app/build.gradle.kts

      - name: Build
        run: |
          if [ "$PRERELEASE" = "true" ]; then kinds="--apk"; else kinds="--aab --apk"; fi
          cargo tauri android build $kinds --target aarch64 --target armv7

      - name: Sign the tester APK with the test key
        if: env.PRERELEASE == 'true'
        env:
          TEST_KEYSTORE_B64: ${{ secrets.TEST_KEYSTORE_B64 }}
          TEST_KEYSTORE_PASSWORD: ${{ secrets.TEST_KEYSTORE_PASSWORD }}
        run: |
          printf '%s' "$TEST_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/test.jks"
          BT="$ANDROID_HOME/build-tools/$BUILD_TOOLS"
          OUT=src-tauri/gen/android/app/build/outputs/apk/universal/release
          mkdir -p out
          "$BT/zipalign" -p -f 4 "$OUT"/app-universal-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/test.jks" --ks-key-alias encedo-test \
            --ks-pass env:TEST_KEYSTORE_PASSWORD --key-pass env:TEST_KEYSTORE_PASSWORD \
            --out "out/encedo-auth-dev-$DEV_VERSION.apk" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --print-certs "out/encedo-auth-dev-$DEV_VERSION.apk" | grep -E 'Verifies|SHA-256'
          "$BT/aapt" dump badging "out/encedo-auth-dev-$DEV_VERSION.apk" | grep -E "^package|native-code"
          rm -f "$RUNNER_TEMP/test.jks"

      - name: Collect outputs and sums
        run: |
          mkdir -p out
          if [ "$PRERELEASE" != "true" ]; then
            cp src-tauri/gen/android/app/build/outputs/bundle/universalRelease/*.aab out/
            cp src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk out/
          fi
          (cd out && sha256sum -- *.apk *.aab 2>/dev/null > SHA256SUMS; cat SHA256SUMS)
          {
            echo "### Android outputs"
            echo
            if [ "$PRERELEASE" = "true" ]; then echo "Tester build \`$DEV_VERSION\`, package \`com.encedo.mobile.auth.android.dev\`, signed with the test key."
            elif [ "$HAS_KEYSTORE" = "true" ]; then echo "Signed with the upload key."
            else echo "**Unsigned.** Sign offline before uploading to Play."; fi
            echo
            echo '```'
            cat out/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ github.run_number }}-${{ env.PRERELEASE == 'true' && 'tester' || (env.HAS_KEYSTORE == 'true' && 'signed' || 'unsigned') }}
          path: out/
          if-no-files-found: error
          retention-days: 30

      - name: Publish the pre-release
        if: env.PRERELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$DEV_TAG" out/*.apk out/SHA256SUMS \
            --target "$GITHUB_SHA" --prerelease \
            --title "Tester build $DEV_VERSION" \
            --notes "$(cat <<EOF
          Test build for sideloading, not the Play release.

          - Package \`com.encedo.mobile.auth.android.dev\`: installs next to v1 and next to the Play version.
          - Signed with the test key, so each tester build updates the previous one. Enable "install unknown apps" for your browser or file manager.
          - Check the download against \`SHA256SUMS\`.
          - Built from ${GITHUB_SHA} by run #${GITHUB_RUN_NUMBER}.
          EOF
          )"
          echo "Pre-release: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$DEV_TAG" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Remove signing material
        if: always()
        run: rm -f src-tauri/gen/android/keystore.properties "$RUNNER_TEMP/upload.jks" "$RUNNER_TEMP/test.jks"
