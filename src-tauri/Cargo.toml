[package]
name = "encedo-authenticator"
version = "2.0.0"
description = "Encedo Mobile Authenticator: approve or deny HEM access requests"
authors = ["Encedo"]
edition = "2021"
publish = false

[lib]
name = "encedo_authenticator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = { path = "plugins/barcode-scanner" }
tauri-plugin-encedo-push = { path = "plugins/encedo-push" }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
