[package]
name = "encedo-authenticator"
version = "2.0.0"
description = "Encedo Mobile Authenticator: approve or deny HEM access requests"
authors = ["Encedo"]
edition = "2021"
publish = false

[lib]
name = "encedo_authenticator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
encedo-protocol = { version = "0.1.0", path = "crates/protocol" }
thiserror = "2"
# reqwest 0.12 with bundled Mozilla roots: no platform trust-store hooks needed on Android/iOS, ring instead of aws-lc (no cmake for the NDK)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "json", "http2"] }
tokio = { version = "1", features = ["time", "macros"] }
aes-gcm = "0.10"
zeroize = { version = "1", features = ["derive"] }
rand_core = { version = "0.6", features = ["getrandom"] }

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = { path = "plugins/barcode-scanner" }
tauri-plugin-encedo-push = { path = "plugins/encedo-push" }
tauri-plugin-encedo-keystore = { path = "plugins/encedo-keystore" }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
