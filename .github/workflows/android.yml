# Android builds, on every push to main and by hand. Same recipe as encedo-chat.
#
# Two jobs after the tests, two artifacts, never mixed in one zip:
#
#   sideload  an APK a phone will install: the .dev build (package
#             com.encedo.mobile.auth.android.dev, name "Encedo HEM Auth dev"),
#             exactly what scripts/vostro-dev-apk.sh produces, SIGNED here with
#             the developer key from secrets. The signing key is the identity of
#             every sideloaded install: a build signed with a different key will
#             not update over the installed one. Use the same key vostro signs
#             with (~/.android/debug.keystore) and both sources stay one app.
#               ANDROID_KEYSTORE_B64       base64 -w0 of the .jks
#               ANDROID_KEYSTORE_PASSWORD  store password
#               ANDROID_KEY_ALIAS          alias inside it
#               ANDROID_KEY_PASSWORD       only if it differs from the store's
#             Missing secrets FAIL the job: an unsigned APK cannot be installed,
#             so there is nothing useful to upload without them.
#             A manual run with the "pre-release" box ticked also publishes this
#             APK as a GitHub pre-release, so a tester without an account can
#             download it.
#
#   play      the release AAB for the Play Console, package ...android.v2.
#             UNSIGNED unless the upload-key secrets exist (UPLOAD_KEYSTORE_B64,
#             UPLOAD_KEYSTORE_PASSWORD, UPLOAD_KEY_ALIAS, UPLOAD_KEY_PASSWORD);
#             without them sign offline with jarsigner, then upload. Play App
#             Signing re-signs with the key it holds either way.
#
# Push needs GOOGLE_SERVICES_JSON (the raw google-services.json of the Firebase
# project; the same file vostro's firebase.xml was made from). Without it the
# app builds and the job says so, but cannot register for push.
#
# versionCode: the Play build takes it from tauri.conf.json (2.0.0 -> 2000000)
# or from the manual input; the sideload build uses 2100000 + run number, above
# the vostro dev counter (2000000 + n), so an Actions build updates over a
# vostro build, not the other way round.
#
# gen/android/buildSrc hard-codes `cargo tauri android android-studio-script`
# (the project was initialised with cargo tauri), hence tauri-cli for cargo.

name: Android

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      prerelease:
        description: "Also publish the sideload APK as a GitHub pre-release"
        required: false
        type: boolean
        default: false
      version_code:
        description: "Play build versionCode (empty = derived from tauri.conf.json)"
        required: false
        type: string

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  TAURI_CLI_VERSION: 2.11.4
  SDK_PACKAGES: platforms;android-36 build-tools;35.0.0 ndk;27.0.12077973

jobs:
  test:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Frontend checks
        run: |
          npm ci
          npm run check
          npm test
          npm run build

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            src-tauri/crates/protocol

      - name: Tauri desktop dependencies (the core is tested as a Linux library)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev pkg-config

      - name: Protocol crate, with the module side for the round trips
        run: cargo test --manifest-path src-tauri/crates/protocol/Cargo.toml --features hem

      - name: App core
        run: cargo test --manifest-path src-tauri/Cargo.toml

  sideload:
    name: Sideload APK (.dev, signed)
    runs-on: ubuntu-24.04
    needs: test
    timeout-minutes: 90
    permissions:
      contents: write   # the pre-release and its tag
    env:
      PRERELEASE: ${{ inputs.prerelease == true }}
      HAS_FIREBASE: ${{ secrets.GOOGLE_SERVICES_JSON != '' }}
      HAS_SIGNING_KEY: ${{ secrets.ANDROID_KEYSTORE_B64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' }}
    steps:
      - uses: actions/checkout@v5

      # Said plainly and early, because the alternative is twenty minutes of
      # Rust followed by an error nobody can read.
      - name: Which secrets this run can see
        run: |
          echo "GOOGLE_SERVICES_JSON: $([ "$HAS_FIREBASE" = true ] && echo set || echo MISSING)"
          echo "ANDROID_KEYSTORE_B64 + ANDROID_KEYSTORE_PASSWORD + ANDROID_KEY_ALIAS: $([ "$HAS_SIGNING_KEY" = true ] && echo set || echo MISSING)"
          if [ "$HAS_SIGNING_KEY" != true ]; then
            echo "::error::No signing key. Set ANDROID_KEYSTORE_B64 (base64 -w0 of the .jks), ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS as repository secrets (Settings > Secrets and variables > Actions > Repository secrets), plus ANDROID_KEY_PASSWORD if the key password differs. An unsigned APK cannot be installed."
            exit 1
          fi
          if [ "$HAS_FIREBASE" != true ]; then
            echo "::warning::GOOGLE_SERVICES_JSON is not visible to this run. The app builds, but will not get a push token. Check it is a Repository secret with exactly that name."
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          packages: ${{ env.SDK_PACKAGES }}
          accept-android-sdk-licenses: true

      - name: Point Tauri at the NDK
        run: echo "NDK_HOME=$(ls -d "$ANDROID_HOME"/ndk/* | head -1)" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: android

      - uses: cargo-bins/cargo-binstall@main
      - name: Tauri CLI for cargo, the version @tauri-apps/cli has in package-lock.json
        run: |
          cargo binstall -y "tauri-cli@$TAURI_CLI_VERSION"
          cargo tauri --version

      - name: Firebase resources
        if: env.HAS_FIREBASE == 'true'
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          printf '%s' "$GOOGLE_SERVICES_JSON" > "$RUNNER_TEMP/google-services.json"
          python3 scripts/firebase-res.py "$RUNNER_TEMP/google-services.json"

      # Mirrors scripts/vostro-dev-apk.sh: the identifier stays the production one
      # (Tauri finds the Kotlin sources by it); the .dev applicationId and the
      # name come from Gradle and strings.xml.
      - name: Dev flavour
        run: |
          python3 - <<'EOF'
          import json, os, pathlib
          base = json.loads(pathlib.Path("src-tauri/tauri.conf.json").read_text())["version"]
          n = int(os.environ["GITHUB_RUN_NUMBER"])
          p = pathlib.Path("src-tauri/tauri.android.conf.json")
          d = json.loads(p.read_text())
          d["productName"] = "Encedo HEM Auth dev"
          d["version"] = f"{base}-dev.{n}"
          d.setdefault("bundle", {}).setdefault("android", {})["versionCode"] = 2100000 + n
          p.write_text(json.dumps(d, indent=2) + "\n")
          print(p.read_text())
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"DEV_VERSION={base}-dev.{n}\nDEV_TAG=v{base}-dev.{n}\n")
          EOF
          sed -i 's/applicationId = "com.encedo.mobile.auth.android.v2"/applicationId = "com.encedo.mobile.auth.android.dev"/' src-tauri/gen/android/app/build.gradle.kts
          sed -i 's/<string name="app_name">[^<]*<\/string>/<string name="app_name">Encedo HEM Auth dev<\/string>/; s/<string name="main_activity_title">[^<]*<\/string>/<string name="main_activity_title">Encedo HEM Auth dev<\/string>/' src-tauri/gen/android/app/src/main/res/values/strings.xml
          grep -q 'applicationId = "com.encedo.mobile.auth.android.dev"' src-tauri/gen/android/app/build.gradle.kts || { echo "::error::applicationId patch did not take"; exit 1; }

      - name: Build
        run: cargo tauri android build --apk --target aarch64 --target armv7

      - name: What was produced
        if: always()
        run: find src-tauri/gen/android -name '*.apk' | sort

      # zipalign first (the installer memory-maps the package), then apksigner
      # (v2/v3 signatures; jarsigner writes v1 only and Android 11+ refuses that).
      - name: Sign the APK with the developer key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          APK=$(find src-tauri/gen/android -name '*unsigned*.apk' | head -1 || true)
          test -n "$APK" || { echo "::error::the build produced no unsigned APK to sign"; exit 1; }
          printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/signing.jks"
          export KPASS="${KEY_PASS:-$KS_PASS}"   # apksigner reads env:KPASS, so it must be exported
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1 || true)
          test -x "$BT/apksigner" || { echo "::error::no build-tools with apksigner under $ANDROID_HOME"; exit 1; }
          mkdir -p out
          OUT="out/encedo-auth-dev-$DEV_VERSION-${GITHUB_SHA:0:8}.apk"
          "$BT/zipalign" -f -p 4 "$APK" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/signing.jks" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KS_PASS --key-pass env:KPASS \
            --out "$OUT" "$RUNNER_TEMP/aligned.apk"
          rm -f "$RUNNER_TEMP/signing.jks"
          "$BT/apksigner" verify --print-certs "$OUT" | grep -E 'Verifies|SHA-256'
          "$BT/aapt" dump badging "$OUT" | grep -E "^package|native-code"
          (cd out && sha256sum -- *.apk > SHA256SUMS && cat SHA256SUMS)
          echo "APK_OUT=$OUT" >> "$GITHUB_ENV"
          {
            echo "### Sideload APK"
            echo
            echo "\`$DEV_VERSION\`, package \`com.encedo.mobile.auth.android.dev\`, signed with the developer key."
            echo "Push: $([ "$HAS_FIREBASE" = true ] && echo yes || echo "**no, GOOGLE_SERVICES_JSON missing**")"
            echo
            echo '```'; cat out/SHA256SUMS; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The APK alone: one file to download and tap, nothing to choose between.
      - uses: actions/upload-artifact@v4
        with:
          name: android-sideload-${{ env.DEV_VERSION }}-${{ github.sha }}
          path: ${{ env.APK_OUT }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish the pre-release
        if: env.PRERELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$DEV_TAG" "$APK_OUT" out/SHA256SUMS \
            --target "$GITHUB_SHA" --prerelease \
            --title "Tester build $DEV_VERSION" \
            --notes "$(cat <<EOF
          Test build for sideloading, not the Play release.

          - Package \`com.encedo.mobile.auth.android.dev\`: installs next to v1 and next to the Play version.
          - Signed with the developer key, so each tester build updates the previous one. Enable "install unknown apps" for your browser or file manager.
          - Check the download against \`SHA256SUMS\`.
          - Built from ${GITHUB_SHA} by run #${GITHUB_RUN_NUMBER}.
          EOF
          )"
          echo "Pre-release: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$DEV_TAG" | tee -a "$GITHUB_STEP_SUMMARY"

  play:
    name: Play AAB (.v2)
    runs-on: ubuntu-24.04
    needs: test
    timeout-minutes: 90
    env:
      HAS_FIREBASE: ${{ secrets.GOOGLE_SERVICES_JSON != '' }}
      HAS_UPLOAD_KEY: ${{ secrets.UPLOAD_KEYSTORE_B64 != '' }}
    steps:
      - uses: actions/checkout@v5

      - name: Which secrets this run can see
        run: |
          echo "GOOGLE_SERVICES_JSON: $([ "$HAS_FIREBASE" = true ] && echo set || echo MISSING)"
          echo "UPLOAD_KEYSTORE_B64: $([ "$HAS_UPLOAD_KEY" = true ] && echo "set, Gradle signs with the upload key" || echo "not set, the AAB stays unsigned for offline signing")"
          if [ "$HAS_FIREBASE" != true ]; then
            echo "::warning::GOOGLE_SERVICES_JSON is not visible to this run. The app builds, but will not get a push token."
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          packages: ${{ env.SDK_PACKAGES }}
          accept-android-sdk-licenses: true

      - name: Point Tauri at the NDK
        run: echo "NDK_HOME=$(ls -d "$ANDROID_HOME"/ndk/* | head -1)" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: android

      - uses: cargo-bins/cargo-binstall@main
      - name: Tauri CLI for cargo, the version @tauri-apps/cli has in package-lock.json
        run: |
          cargo binstall -y "tauri-cli@$TAURI_CLI_VERSION"
          cargo tauri --version

      - name: Firebase resources
        if: env.HAS_FIREBASE == 'true'
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          printf '%s' "$GOOGLE_SERVICES_JSON" > "$RUNNER_TEMP/google-services.json"
          python3 scripts/firebase-res.py "$RUNNER_TEMP/google-services.json"

      - name: Upload key for Gradle signing
        if: env.HAS_UPLOAD_KEY == 'true'
        env:
          UPLOAD_KEYSTORE_B64: ${{ secrets.UPLOAD_KEYSTORE_B64 }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          printf '%s' "$UPLOAD_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          umask 077
          cat > src-tauri/gen/android/keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/upload.jks
          storePassword=$UPLOAD_KEYSTORE_PASSWORD
          keyAlias=$UPLOAD_KEY_ALIAS
          keyPassword=$UPLOAD_KEY_PASSWORD
          EOF

      - name: versionCode override
        if: inputs.version_code != ''
        env:
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          python3 - <<'EOF'
          import json, os, pathlib
          p = pathlib.Path("src-tauri/tauri.android.conf.json")
          d = json.loads(p.read_text())
          d.setdefault("bundle", {}).setdefault("android", {})["versionCode"] = int(os.environ["VERSION_CODE"])
          p.write_text(json.dumps(d, indent=2) + "\n")
          print(p.read_text())
          EOF

      - name: Build
        run: cargo tauri android build --aab --target aarch64 --target armv7

      - name: What was produced
        if: always()
        run: find src-tauri/gen/android -name '*.aab' | sort

      - name: Collect
        run: |
          mkdir -p out
          cp src-tauri/gen/android/app/build/outputs/bundle/universalRelease/*.aab out/
          (cd out && sha256sum -- *.aab > SHA256SUMS && cat SHA256SUMS)
          {
            echo "### Play AAB"
            echo
            if [ "$HAS_UPLOAD_KEY" = true ]; then echo "Signed with the upload key."; else echo "**Unsigned.** Sign offline with the upload key before uploading to Play:"; echo; echo '```'; echo 'jarsigner -keystore upload.jks -signedjar app-release.aab app-universal-release.aab <alias>'; echo '```'; fi
            echo
            echo '```'; cat out/SHA256SUMS; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: android-aab-${{ env.HAS_UPLOAD_KEY == 'true' && 'signed' || 'unsigned' }}-${{ github.run_number }}-${{ github.sha }}
          path: out/
          if-no-files-found: error
          retention-days: 30

      - name: Remove signing material
        if: always()
        run: rm -f src-tauri/gen/android/keystore.properties "$RUNNER_TEMP/upload.jks"
