# Android build for Google Play, run on every push to v2 and by hand.
#
# What comes out: a release AAB (for Play) and a release APK (to sideload),
# both for arm64 + armv7, with a SHA256SUMS file, as one workflow artifact.
#
# Two ways to sign, chosen by which secrets exist in the repository:
#   - no UPLOAD_KEYSTORE_B64 secret: the outputs are UNSIGNED. Download them,
#     check the sums, sign offline with the upload key (jarsigner for the AAB,
#     apksigner for the APK) and upload to Play. Play App Signing then re-signs
#     with the app signing key it holds.
#   - UPLOAD_KEYSTORE_B64 + UPLOAD_KEYSTORE_PASSWORD + UPLOAD_KEY_ALIAS +
#     UPLOAD_KEY_PASSWORD set: Gradle signs here with the upload key, exactly as
#     scripts/vostro-release-aab.sh does.
#
# Push needs GOOGLE_SERVICES_JSON (the raw google-services.json for the Firebase
# project); without it the app still builds, but cannot register for push.
#
# versionCode comes from tauri.conf.json (2.0.0 -> 2000000) unless the manual
# run sets one; Play refuses an upload that does not raise it.

name: Android

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version_code:
        description: "Android versionCode (empty = derived from tauri.conf.json)"
        required: false
        type: string

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  NDK_VERSION: 27.0.12077973

jobs:
  test:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Frontend checks
        run: |
          npm ci
          npm run check
          npm test
          npm run build

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            src-tauri/crates/protocol

      - name: Tauri desktop dependencies (the core is tested as a Linux library)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev pkg-config

      - name: Protocol crate, with the module side for the round trips
        run: cargo test --manifest-path src-tauri/crates/protocol/Cargo.toml --features hem

      - name: App core
        run: cargo test --manifest-path src-tauri/Cargo.toml

  android:
    name: AAB + APK
    runs-on: ubuntu-24.04
    needs: test
    timeout-minutes: 90
    env:
      # Secrets cannot be read in `if:`; they can in env, so the choice is made here.
      HAS_KEYSTORE: ${{ secrets.UPLOAD_KEYSTORE_B64 != '' }}
      HAS_FIREBASE: ${{ secrets.GOOGLE_SERVICES_JSON != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-36 build-tools;35.0.0 ndk;27.0.12077973
          accept-android-sdk-licenses: true

      - name: Point Tauri at the NDK
        run: echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: android

      - name: Firebase resources
        if: env.HAS_FIREBASE == 'true'
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          printf '%s' "$GOOGLE_SERVICES_JSON" > "$RUNNER_TEMP/google-services.json"
          python3 scripts/firebase-res.py "$RUNNER_TEMP/google-services.json"

      - name: No Firebase config
        if: env.HAS_FIREBASE != 'true'
        run: echo "::warning::GOOGLE_SERVICES_JSON is not set. The app builds, but will not get a push token."

      - name: Upload key for Gradle signing
        if: env.HAS_KEYSTORE == 'true'
        env:
          UPLOAD_KEYSTORE_B64: ${{ secrets.UPLOAD_KEYSTORE_B64 }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          printf '%s' "$UPLOAD_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          umask 077
          cat > src-tauri/gen/android/keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/upload.jks
          storePassword=$UPLOAD_KEYSTORE_PASSWORD
          keyAlias=$UPLOAD_KEY_ALIAS
          keyPassword=$UPLOAD_KEY_PASSWORD
          EOF

      - name: versionCode override
        if: inputs.version_code != ''
        env:
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          python3 - <<'EOF'
          import json, os, pathlib
          p = pathlib.Path("src-tauri/tauri.android.conf.json")
          d = json.loads(p.read_text())
          d.setdefault("bundle", {}).setdefault("android", {})["versionCode"] = int(os.environ["VERSION_CODE"])
          p.write_text(json.dumps(d, indent=2) + "\n")
          print(p.read_text())
          EOF

      - name: Build
        run: npm run tauri -- android build --aab --apk --target aarch64 --target armv7

      - name: Collect outputs and sums
        run: |
          mkdir -p out
          cp src-tauri/gen/android/app/build/outputs/bundle/universalRelease/*.aab out/
          cp src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk out/
          (cd out && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)
          {
            echo "### Android outputs"
            echo
            if [ "$HAS_KEYSTORE" = "true" ]; then echo "Signed with the upload key."; else echo "**Unsigned.** Sign offline before uploading to Play."; fi
            echo
            echo '```'
            cat out/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ github.run_number }}-${{ env.HAS_KEYSTORE == 'true' && 'signed' || 'unsigned' }}
          path: out/
          if-no-files-found: error
          retention-days: 30

      - name: Remove signing material
        if: always() && env.HAS_KEYSTORE == 'true'
        run: rm -f src-tauri/gen/android/keystore.properties "$RUNNER_TEMP/upload.jks"
